server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS - allows re-resolving backend when container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:9000;

    # API requests - pass to Laravel (PHP-FPM)
    location /api {
        fastcgi_pass $backend_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Frontend - proxy to Nuxt dev server running locally (host.docker.internal = host machine)
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
